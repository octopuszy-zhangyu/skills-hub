name: Validate Skills

on:
  push:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'openclaw.plugin.json'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'openclaw.plugin.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate YAML Frontmatter & Plugin JSON
        run: python scripts/ci_validate.py

      - name: Validate Skill Names
        run: |
          errors=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            if ! echo "$name" | grep -qE '^[a-z0-9-]+$'; then
              echo "FAIL $name: Invalid name (use only lowercase letters, numbers, hyphens)"
              errors=$((errors + 1))
            else
              echo "OK $name: Valid name"
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors errors"
            exit 1
          fi
          echo "All names validated successfully"

      - name: Validate Test Scenarios
        run: |
          for dir in skills/*/; do
            name=$(basename "$dir")
            test_dir="tests/scenarios/$name"
            if [ ! -d "$test_dir" ]; then
              echo "WARN $name: No test scenarios directory"
              continue
            fi
            if [ ! -f "$test_dir/baseline.md" ]; then
              echo "WARN $name: Missing baseline.md"
            fi
            if [ ! -f "$test_dir/pressure-test.md" ]; then
              echo "WARN $name: Missing pressure-test.md"
            fi
            if [ -f "$test_dir/baseline.md" ] && [ -f "$test_dir/pressure-test.md" ]; then
              echo "OK $name: Test scenarios found"
            fi
          done
