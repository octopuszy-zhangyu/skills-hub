name: Validate Skills

on:
  push:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'openclaw.plugin.json'
  pull_request:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'openclaw.plugin.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run Sync & Validation Script
        run: python scripts/sync.py

      - name: Validate Skill Structure
        run: |
          errors=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            if [ ! -f "${dir}SKILL.md" ]; then
              echo "❌ $name: Missing SKILL.md"
              errors=$((errors + 1))
              continue
            fi
            echo "✅ $name: Has SKILL.md"
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors errors"
            exit 1
          fi
          echo "All skills validated successfully"

      - name: Validate YAML Frontmatter
        run: |
          errors=0
          for skillfile in skills/*/SKILL.md; do
            name=$(basename "$(dirname "$skillfile")")
            python3 -c "
import yaml, sys
with open('$skillfile') as f:
    content = f.read()
parts = content.split('---', 2)
if len(parts) < 3:
    print('❌ $name: Invalid YAML frontmatter')
    sys.exit(1)
try:
    meta = yaml.safe_load(parts[1])
    if not isinstance(meta, dict):
        print('❌ $name: Frontmatter is not a dictionary')
        sys.exit(1)
    if 'name' not in meta:
        print('❌ $name: Missing required field: name')
        sys.exit(1)
    if 'description' not in meta:
        print('❌ $name: Missing required field: description')
        sys.exit(1)
    if not meta['description'].startswith('Use when'):
        print('❌ $name: description should start with \"Use when...\"')
        sys.exit(1)
    print('✅ $name: Valid frontmatter')
except yaml.YAMLError as e:
    print(f'❌ $name: YAML error: {e}')
    sys.exit(1)
" || errors=$((errors + 1))
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors errors"
            exit 1
          fi
          echo "All frontmatter validated successfully"

      - name: Validate Skill Names
        run: |
          errors=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            if ! echo "$name" | grep -qE '^[a-z0-9-]+$'; then
              echo "❌ $name: Invalid name (use only lowercase letters, numbers, hyphens)"
              errors=$((errors + 1))
            else
              echo "✅ $name: Valid name"
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors errors"
            exit 1
          fi
          echo "All names validated successfully"

      - name: Validate Test Scenarios
        run: |
          errors=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            test_dir="tests/scenarios/$name"
            if [ ! -d "$test_dir" ]; then
              echo "⚠️  $name: No test scenarios directory"
              continue
            fi
            if [ ! -f "$test_dir/baseline.md" ]; then
              echo "⚠️  $name: Missing baseline.md in test scenarios"
            fi
            if [ ! -f "$test_dir/pressure-test.md" ]; then
              echo "⚠️  $name: Missing pressure-test.md in test scenarios"
            fi
            if [ -f "$test_dir/baseline.md" ] && [ -f "$test_dir/pressure-test.md" ]; then
              echo "✅ $name: Test scenarios found"
            fi
          done

      - name: Validate openclaw.plugin.json
        run: |
          python3 -c "
import json, sys
with open('openclaw.plugin.json') as f:
    plugin = json.load(f)
required = ['id', 'name', 'description', 'version', 'skills']
for field in required:
    if field not in plugin:
        print(f'❌ Missing required field: {field}')
        sys.exit(1)
print('✅ openclaw.plugin.json is valid')
print(f'   Skills listed: {len(plugin[\"skills\"])}')
"